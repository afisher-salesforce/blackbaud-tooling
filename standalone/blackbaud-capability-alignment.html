<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackbaud × Salesforce — Capability Alignment</title>
<style>
:root{
  --bg:#0a0f1a; --card:#111827; --cardh:#1a2234; --border:#1e293b; --borderl:#334155;
  --accent:#8da2e8; --header:#0d1321;
  --t1:#e5e9f2; --t2:#aab4c7; --t3:#7a8699; --t4:#5b6678;
}
html[data-theme="light"]{
  --bg:#f8fafc; --card:#ffffff; --cardh:#f1f5f9; --border:#e2e8f0; --borderl:#cbd5e1;
  --accent:#2c3e8c; --header:#f1f5f9;
  --t1:#0f172a; --t2:#334155; --t3:#64748b; --t4:#94a3b8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--t2);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
h1,h2,h3{color:var(--t1);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--header) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.hrow{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.brand b{color:var(--t1);font-size:13px;display:block;line-height:1.2}
.brand span{color:var(--t3);font-size:10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:7px;font-size:13px;color:var(--t3);background:none;border:1px solid transparent;cursor:pointer}
.tab:hover{color:var(--t2);background:var(--cardh)}
.tab.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:600}
.hbtn{background:none;border:1px solid var(--border);color:var(--t3);border-radius:7px;padding:6px 10px;cursor:pointer;font-size:13px}
.hbtn:hover{color:var(--t2);border-color:var(--borderl)}
.view{display:none;padding-top:22px}
.view.active{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px}
.card .hd{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card .bd{padding:18px}
.muted{color:var(--t3)} .faint{color:var(--t4)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid;padding:2px 9px;font-size:11px;font-weight:600;line-height:1.6}
.dot{width:9px;height:9px;border-radius:999px;display:inline-block;flex:none}
.pill{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t4);border:1px solid var(--border);border-radius:4px;padding:2px 6px}
.hero{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--border);background:var(--card);padding:30px}
.kicker{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.hero h1{font-size:24px;line-height:1.25;max-width:760px;margin-bottom:12px}
.hero p{color:var(--t2);max-width:760px}
.banner{display:flex;gap:12px;border-radius:10px;padding:12px 14px;margin-top:16px}
.banner.amber{border:1px solid #f59e0b40;background:#f59e0b1a}
.banner.green{border:1px solid #10b98140;background:#10b9811a}
.disc{color:var(--t3);font-size:11px;font-style:italic;margin-top:8px}
.row{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}
.rail{display:flex;flex-direction:column;gap:12px;width:210px;flex:none}
@media(max-width:820px){.rail{flex-direction:row;flex-wrap:wrap;width:100%}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat .n{font-size:30px;font-weight:800;color:var(--accent);line-height:1}
.stat .l{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--t4);margin-top:6px}
.grid-heat{display:grid;grid-template-columns:200px 1fr 1fr;gap:8px;align-items:stretch;min-width:560px}
.lane-h{border-radius:7px;padding:4px 12px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--t4)}
.cell{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;border-radius:7px;min-height:38px;align-content:flex-start}
.hdot{width:14px;height:14px;border-radius:999px;border:1px solid rgba(0,0,0,.1);cursor:pointer;position:relative;transition:transform .1s}
.hdot:hover{transform:scale(1.25)}
.tip{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:6px;z-index:40;display:none;width:max-content;max-width:230px}
.hdot:hover .tip,.vdot:hover .tip{display:block}
.tip .box{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:left}
.tip b{color:var(--t1);font-size:11px}
.selrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=search]{background:var(--card);border:1px solid var(--border);color:var(--t2);border-radius:7px;padding:6px 9px;font-size:12px}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--t4);padding:10px 12px;border-bottom:1px solid var(--border);background:var(--header);position:sticky;top:52px}
tbody td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--cardh)}
tr.detail>td{background:var(--cardh);cursor:default}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.detail-grid{grid-template-columns:1fr}.detail-table thead{display:none}}
.note{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:14px}
.note .t{font-size:12px;font-weight:700;color:var(--t2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.venn-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:11px;color:var(--t3);border:1px solid var(--border);background:var(--card);border-radius:10px;padding:10px 16px;margin-bottom:16px}
.stage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1100px){.stage-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.stage-grid{grid-template-columns:1fr}}
.capcard{width:100%;text-align:left;border:1px solid var(--border);background:var(--cardh);border-radius:9px;padding:12px;cursor:pointer}
.capcard.native{border-color:#10b98166;background:#10b9810f}
.capcard:hover{border-color:color-mix(in srgb,var(--accent) 50%,transparent)}
.capcard .nm{font-size:13px;font-weight:700;color:var(--t1);line-height:1.3}
.toolline{display:flex;gap:6px;align-items:flex-start;font-size:11px;color:var(--t3);margin-top:8px}
.footer{margin-top:30px;padding-top:16px;border-top:1px solid var(--border);font-size:11px;color:var(--t4);text-align:center}
.secttitle{margin:4px 0 2px;font-size:19px}
.sechd{margin-bottom:4px}
details.cap>summary{display:none}
.flex{display:flex} .wrap-f{flex-wrap:wrap} .gap8{gap:8px} .gap12{gap:12px} .mt8{margin-top:8px} .mt16{margin-top:16px} .mb16{margin-bottom:16px}
.center{display:flex;align-items:center}
</style>
</head>

<header>
  <div class="hrow">
    <div class="brand">
      <div class="logo">◆</div>

</div>
<script>
const DATA = {"caps":[{"id":"crm-system-of-record","vs":"A2R","domain":"CRM & Core Platform","name":"CRM System of Record","tools":["Blackbaud Salesforce","JG Salesforce"],"users":"Sales, Service & GTM (enterprise); JustGiving Sales & Marketing","alignment":"native","sf":["Sales Cloud","Service Cloud"],"gemini":"Google Gemini: Covered — core Sales Cloud & Service Cloud is the enterprise system of record; JustGiving CRM also fully covered.","seReview":"This is the anchor of the whole conversation: Blackbaud already runs two Salesforce orgs as systems of record. Everything else on this map is about consolidating around an investment they already own.","prompts":["Are the Blackbaud and JustGiving orgs on a path to converge, or stay separate? That shapes every downstream consolidation.","Which teams treat Salesforce as the source of truth today vs. working out of a point tool?"],"overlaps":[],"ent":"owned","entExpiry":null,"entProducts":["Sales & Service Cloud – Unlimited Edition (2,374 seats)","Salesforce Foundations"],"clm":"onboard"},{"id":"revenue-forecasting","vs":"A2R","domain":"Revenue Intelligence","name":"Forecasting & Pipeline","tools":["Clari"],"users":"Sales / Revenue Operations","alignment":"native","sf":["Collaborative Forecasting","Pipeline Inspection","Territory Management","Agentforce for Sales"],"gemini":"Google Gemini: Covered — Revenue Intelligence, Collaborative Forecasting, Pipeline Inspection, Einstein deal health.","seReview":"This is the live one: Blackbaud is running a forecasting RFP (Clari / Gong Forecast) for a capability it ALREADY owns — Collaborative Forecasting + Territory Management are included in Sales & Service Cloud Unlimited, and Agentforce for Sales (owned) adds conversational access to the forecast. Chris Lindner’s reaction captured it: \"$300K saved right out of the box.\" This is an IMPLEMENTATION play, not a procurement play. The one parity item to validate live: forward-looking conversion analytics (not just current-quarter rollup).","prompts":["What does Clari give RevOps today that collaborative forecasting + Pipeline Inspection would need to match before a switch?","Is the Clari renewal timing the forcing function for sequencing this first?"],"overlaps":["Clari"],"ent":"owned","entExpiry":null,"entProducts":["Sales & Service Cloud – Unlimited Edition (2,374 seats)","Salesforce Foundations"],"clm":"grow"},{"id":"conversation-intelligence","vs":"A2R","domain":"Revenue Intelligence","name":"Conversation Intelligence","tools":["Gong"],"users":"Sales, Marketing & Customer Success","alignment":"partial","sf":["Customer Experience Intelligence (CXI)","Einstein Conversation Insights"],"gemini":"Google Gemini: Covered — Einstein Conversation Insights (call/meeting recording analysis, transcription, competitor mentions, coaching).","seReview":"Important entitlement note: Blackbaud ALREADY owns Customer Experience Intelligence (Unlimited) — the conversation-intelligence capability that overlaps Gong is a paid, active entitlement, not a net-new buy. Still Partial on the business side: the prep call flagged that unwinding Gong is NOT a clean swap — it is woven into the sales process across Sales, Marketing and CS. So the honest message is \"you already own an overlapping capability; whether/when to consolidate onto it is a sales-process conversation, not a licensing one.\"","prompts":["Which teams depend on Gong today, and for what exactly — coaching, deal intelligence, or forecasting signal?","Would a phased ECI pilot alongside Gong de-risk this more than a cutover?"],"overlaps":["Gong"],"ent":"owned","entExpiry":null,"entProducts":["Customer Experience Intelligence – Unlimited Edition","Additional CXI Signals (100)"],"clm":null},{"id":"marketing-attribution","vs":"A2R","domain":"Revenue Intelligence","name":"Marketing Attribution","tools":["Marketo Measure (Bizible)"],"users":"Marketing","alignment":"partial","sf":["Marketing Cloud Account Engagement","CRM Analytics","Data 360"],"gemini":"Google Gemini: Covered — Account Engagement + CRM Analytics / Data Cloud for multi-touch campaign influence and revenue attribution.","seReview":"Partial. Multi-touch attribution modeling is a genuine strength of Marketo Measure; Salesforce can land campaign influence + revenue attribution natively, but parity on the attribution modeling depends on the marketing-automation decision (see Marketo) and how much is already in Data 360.","prompts":["Is attribution tied to keeping Marketo, or could it move with a marketing-platform decision?"],"overlaps":[],"ent":"not-licensed","entExpiry":null,"entProducts":[],"clm":null},{"id":"sales-engagement-dialer","vs":"A2R","domain":"Revenue Intelligence","name":"Sales Engagement / Dialer","tools":["Nooks"],"users":"Sales / Revenue","alignment":"native","sf":["Sales Engagement","Sales Dialer"],"gemini":"Google Gemini: Covered — Sales Engagement (High Velocity Sales): native dialer, call scripts, automated cadences.","seReview":"Agree Native for the cadence/dialer jobs. Nooks adds an AI parallel-dialer/virtual-floor angle worth confirming is in scope.","prompts":["Is the Nooks value the dialer, the cadences, or the AI calling floor specifically?"],"overlaps":[],"ent":"not-licensed","entExpiry":null,"entProducts":[],"clm":"acquire"},{"id":"marketing-automation-platform","vs":"A2R","domain":"Marketing Automation","name":"Marketing Automation Platform","tools":["Marketo (Engage)"],"users":"Marketing","alignment":"discuss","sf":["Marketing Cloud Account Engagement","Marketing Cloud Growth / Advanced"],"gemini":"Google Gemini grouped Marketo with Demandbase + Qualified as Covered via Account Engagement + Agentforce chat.","seReview":"Flagged Discuss, not Covered. The prep call was explicit: Blackbaud doesn’t love Marketo, but Marketing Cloud is NOT a clean replacement — it lacks the identity/personalization connection they need and would require web work to bridge. This is the weakest consolidation story today; raise it as discovery, not a recommendation.","prompts":["What specifically is missing from Marketo today — and is the gap identity/personalization or the automation engine?","Where does the identity/personalization requirement actually live (web, CDP, CRM)?"],"overlaps":[],"ent":"owned-expiring","entExpiry":"Dec 2026","entProducts":["Marketing Cloud Engagement – Corporate Edition"],"clm":null},{"id":"abm-orchestration","vs":"A2R","domain":"Marketing Automation","name":"ABM Orchestration","tools":["Demandbase"],"users":"Marketing","alignment":"partial","sf":["Marketing Cloud Account Engagement","Data 360"],"gemini":"Google Gemini: Covered (grouped with Marketo/Qualified).","seReview":"Partial. Account-based nurture + scoring can land in Salesforce, but Demandbase’s intent/advertising orchestration overlaps with the ABM & Data Intelligence tools below and is better discussed as a cluster.","prompts":["Is Demandbase used for intent, advertising orchestration, or account scoring primarily?"],"overlaps":[],"ent":"not-licensed","entExpiry":null,"entProducts":[],"clm":null},{"id":"website-chat-conversational","vs":"A2R","domain":"Marketing Automation","name":"Website Chat / Conversational","tools":["Qualified"],"users":"Marketing","alignment":"native","sf":["Qualified (now part of Salesforce)","Agentforce","Messaging for Web"],"gemini":"Google Gemini: Covered — Agentforce chat / conversational bots.","seReview":"Entitlement update: Qualified is now part of Salesforce AND Blackbaud already owns it (Qualified Agentic Marketing Platform + SFDC connector, 260 seats) — the website chat on Blackbaud.com IS Qualified today. So this isn’t \"could adopt\" — it’s already in use. The opportunity is to link Qualified into the broader marketing + SDR architecture now that it is Salesforce-native, rather than treating it as a standalone point tool.","prompts":["Would an Agentforce web-chat proof against a Blackbaud use case help make this concrete?"],"overlaps":[],"ent":"owned","entExpiry":null,"entProducts":["Qualified Agentic Marketing Platform","Qualified SFDC Connector","Qualified Calendar & Email (260)"],"clm":"acquire"},{"id":"lead-routing-matching","vs":"A2R","domain":"Marketing Automation","name":"Lead Routing / Matching","tools":["LeanData"],"users":"Marketing / Revenue Operations","alignment":"native","sf":["Lead Assignment Rules","Omni-Channel Routing","Flow Orchestration"],"gemini":"Google Gemini: Covered — Assignment Rules, Omni-Channel Routing, Flow Orchestration, Lead-to-Account matching.","seReview":"Agree Native for standard routing. The honest nuance: LeanData’s more complex matching/round-robin graphs are where teams sometimes keep it — worth confirming their routing complexity.","prompts":["How complex is the current routing logic — simple rules, or multi-object round-robin graphs?"],"overlaps":[],"ent":"not-licensed","entExpiry":null,"entProducts":[],"clm":"acquire"},{"id":"meeting-scheduling","vs":"A2R","domain":"Scheduling","name":"Meeting Scheduling","tools":["Chili Piper (Gong contract)","OnceHub"],"users":"Sales / Revenue; IT Core / End User","alignment":"native","sf":["Salesforce Scheduler","Einstein 1 Inbox"],"gemini":"Google Gemini: Covered — Salesforce Scheduler + Inbox calendar links; round-robin scheduling.","seReview":"Agree Native. Note Chili Piper rides the Gong contract, so it is entangled with the Gong decision; OnceHub is a cleaner standalone consolidation. (Calendly sits in the I2R scheduling row.)","prompts":["Three scheduling tools across teams — is there appetite to standardize on one native option?"],"overlaps":[],"ent":"not-licensed","entExpiry":null,"entProducts":[],"clm":"acquire"},{"id":"enablement-content","vs":"A2R","domain":"Sales Enablement","name":"Content Mgmt, Enablement & Buyer Room","tools":["Spekit"],"users":"Sales / Marketing Enablement (ETG)","alignment":"partial","sf":["Enablement (formerly Sales Enablement)","In-App Guidance"],"gemini":"Google Gemini: Covered — Salesforce Enablement (In-App Guidance & Sales Cloud Guidance): embedded microlearning, contextual help.","seReview":"Partial. In-App Guidance + Enablement cover the embedded-help and program jobs. Note the product is now \"Enablement\" (the former myTrailhead branding is retired) — don’t say myTrailhead. Spekit’s just-in-time knowledge-overlay style is the piece to validate.","prompts":["Is Spekit used for rep onboarding programs, or just-in-time field-level help, or both?"],"overlaps":[],"ent":"not-licensed","entExpiry":null,"entProducts":[],"clm":null},{"id":"demo-automation","vs":"A2R","domain":"Sales Enablement","name":"Demo Automation","tools":["Consensus"],"users":"Sales / Revenue","alignment":"gap","sf":[],"gemini":"Google Gemini: Not Covered — Salesforce has no interactive branching video product-demo platform like Consensus.","seReview":"Agree genuine Gap. Leave it; naming gaps honestly protects the credibility of the Native calls.","prompts":[],"overlaps":[],"ent":"na","entExpiry":null,"entProducts":[],"clm":null},{"id":"rfp-proposal","vs":"A2R","domain":"Sales Enablement","name":"RFP / Proposal Automation","tools":["Responsive.io (RFPIO)"],"users":"Sales / Sales Engineering","alignment":"gap","sf":[],"gemini":"Google Gemini: Not Covered — no dedicated AI RFP/tender response content database.","seReview":"Mostly a Gap for the dedicated RFP-response database. The one forward-looking nuance to mention, not claim: an Agentforce + knowledge-grounded agent could assist drafting responses — but that is roadmap, not parity with Responsive today.","prompts":["Is there interest in an AI-assisted drafting angle later, or is Responsive firmly owned?"],"overlaps":[],"ent":"na","entExpiry":null,"entProducts":[],"clm":null},{"id":"prospecting-sales-intelligence","vs":"A2R","domain":"Sales Enablement","name":"Prospecting / Sales Intelligence","tools":["LinkedIn Sales Navigator (MSFT D365 Relationship Sales Plus)"],"users":"Sales / Revenue (Microsoft EA)","alignment":"integrates","sf":["Sales Navigator for Salesforce","Data 360","Einstein Activity Capture"],"gemini":"Google Gemini: Inconclusive — Einstein Activity Capture + Data Cloud offer relationship insights, but LinkedIn’s proprietary B2B graph requires Sales Navigator.","seReview":"THE canonical shades-of-gray example. This is not Covered and not a Gap: Salesforce surfaces Sales Navigator INSIDE the record (the Sales Navigator app for Salesforce), and Data 360 can unify its signal — so the honest placement is Integrates. You keep the LinkedIn graph (it rides a Microsoft EA) and still get it in-platform. Classic \"both/and,\" which is why binary verdicts mislead here.","prompts":["Sales Navigator rides a Microsoft EA — is the goal to replace it, or to surface it inside Salesforce so reps stop context-switching?","Would unifying LinkedIn signal via Data 360 onto the account record be valuable even if the license stays?"],"overlaps":[],"ent":"not-licensed","entExpiry":null,"entProducts":[],"clm":"acquire"},{"id":"data-enrichment-prospecting","vs":"A2R","domain":"ABM & Data Intelligence","name":"Data Enrichment / Prospecting","tools":["Clay Labs"],"users":"Marketing / Revenue Operations","alignment":"partial","sf":["Data 360","Data Cloud enrichment"],"gemini":"Google Gemini: Inconclusive — Data Cloud unifies/enriches, but Clay’s multi-source waterfall scraping is external.","seReview":"Partial is right. Data 360 unifies and can enrich profiles; Clay’s automated waterfall-enrichment workflows are a distinct capability. Keep-and-unify (Data 360) is the realistic story, not replace.","prompts":["Is Clay’s value the waterfall-enrichment automation, or the enriched data itself (which could land in Data 360)?"],"overlaps":[],"ent":"not-licensed","entExpiry":null,"entProducts":[],"clm":null},{"id":"competitive-intelligence","vs":"A2R","domain":"ABM & Data Intelligence","name":"Competitive Intelligence","tools":["Klue Intelligence"],"users":"Marketing / Revenue","alignment":"partial","sf":["Quip / Files (battlecards)","Enablement"],"gemini":"Google Gemini: Inconclusive — Sales Cloud stores competitor info/battlecards, but automated web scraping is Klue.","seReview":"Partial. Battlecard storage/distribution can live in Salesforce; the automated competitive-intel gathering/scraping is Klue’s distinct value. Likely keep Klue, surface its output.","prompts":["Would battlecards delivered in-flow (Enablement) reduce the need for a second surface?"],"overlaps":[],"ent":"not-licensed","entExpiry":null,"entProducts":[],"clm":null},{"id":"lead-to-account-media","vs":"A2R","domain":"ABM & Data Intelligence","name":"Lead-to-Account / Media · Intent / Demand · Social Listening","tools":["Integrate.com","DemandFactor","Brandwatch"],"users":"Marketing","alignment":"partial","sf":["Data 360","Marketing Cloud"],"gemini":"Google Gemini: Inconclusive — Data Cloud unifies customer graphs, but 3rd-party intent feeds + media syndication + social listening need partners.","seReview":"Partial / Data 360. These are data-feed and listening tools; the pattern is unify-and-activate the signal in Data 360, keep the specialized sources. Not a replacement story.","prompts":["Which of these feeds would be most valuable unified onto the customer record?"],"overlaps":[],"ent":"not-licensed","entExpiry":null,"entProducts":[],"clm":null},{"id":"web-product-analytics","vs":"A2R","domain":"Analytics & Measurement","name":"Web / Product Analytics · Session Replay · Survey/Forms · Data Pipeline","tools":["Adobe Analytics","Mouseflow","PointerPro","Windsor.AI"],"users":"Marketing","alignment":"partial","sf":["Data 360","Tableau","Tableau Next"],"gemini":"Google Gemini: Inconclusive — Data Cloud + Tableau analyze web data, but qualitative heatmaps/DOM session replay (Mouseflow) are outside core CRM.","seReview":"Partial, with an entitlement flag: Tableau is OWNED but EXPIRES ~Jan 2027 (Q4 FY2027) — a near-term decision point. Tableau Next (embedded, now part of the entitlement) covers the Salesforce-resident analytics natively and works best when data is in Salesforce or zero-copied into Data 360; standalone Tableau to replace Qlik is a separate renewal conversation. Session-replay/heatmap (Mouseflow) is a genuine gap within this cluster — analytics = strong, replay = keep.","prompts":["Is the goal unified measurement (Tableau/Data 360) or the behavioral-replay tooling specifically?"],"overlaps":[],"ent":"owned-expiring","entExpiry":"~Jan 2027","entProducts":["Tableau Cloud (Creator/Viewer)","Tableau Server (Creator/Explorer/Viewer)"],"clm":null},{"id":"voc-survey","vs":"A2R","domain":"Analytics & Measurement","name":"Survey / Experience (VoC)","tools":["Qualtrics Labs"],"users":"Customer Operations / Research","alignment":"partial","sf":["Feedback Management","Salesforce Surveys"],"gemini":"Google Gemini: Covered — Feedback Management & Surveys embed CSAT/NPS into Case/Contact lifecycles.","seReview":"Partial, not Covered. Salesforce Surveys/Feedback Management covers embedded CSAT/NPS tied to records; Qualtrics is a far deeper experience-management platform (advanced research, stats, XM). For transactional CSAT in-CRM, native fits; for enterprise XM, keep Qualtrics.","prompts":["Is Qualtrics doing transactional CSAT, or deep experience-management research? The answer decides the fit."],"overlaps":[],"ent":"not-licensed","entExpiry":null,"entProducts":[],"clm":null},{"id":"seo-tools","vs":"A2R","domain":"Analytics & Measurement","name":"SEO / Search Console / Competitive Research","tools":["Google Search Console","Semrush"],"users":"Marketing (SEO)","alignment":"gap","sf":[],"gemini":"Google Gemini: Not Covered — no web-crawler/keyword search-performance databases for SEO.","seReview":"Agree Gap. Clean example of where Salesforce correctly does not play.","prompts":[],"overlaps":[],"ent":"na","entExpiry":null,"entProducts":[],"clm":null},{"id":"web-experimentation-cms","vs":"A2R","domain":"Content & Creative","name":"Web Experimentation / CMS","tools":["Optimizely (JG + US)"],"users":"JustGiving & US Di  Professional Services","alignment":"native","sf":["Revenue Cloud Advanced","Agentforce Revenue Management (ARM)","CPQ Plus (legacy)"],"gemini":"Google Gemini: Covered — Salesforce CPQ / Revenue Cloud: PS rate cards, SOW quoting, approval matrices, contracts.","seReview":"The sharpest entitlement finding on the whole map: Blackbaud is paying for BOTH the legacy CPQ Plus (SteelBrick) AND its replacement, Revenue Cloud Advanced (the \"CPQ Upgrade\"), simultaneously — the migration stalled, so the old and new sit side by side on the entitlement. Restarting that migration is a Professional Services engagement, not a licensing question. Crucially it is NOT a standalone CPQ swap: configure-price-quote is inseparable from opportunity management (new-logo deals the sales team runs) and from renewals (which Customer Success runs) — so a Revenue Cloud deployment is really a sales-and-renewal PROCESS change. Pairing it with CLM and Agentforce Revenue Management (ARM) is the right shape: ARM unlocks product-catalog, pricing and bundling, all API-enabled unlike CPQ. (OSF is the likely implementation partner.)","prompts":["The migration from CPQ Plus to Revenue Cloud Advanced stalled — what blocked it, and what would it take to restart (a Professional Services engagement scoped around it)?","Who owns the quote-to-cash process end to end today — sales for new logos, CS for renewals? A Revenue Cloud deployment changes both, so both need to be at the table.","Should CLM and Agentforce Revenue Management (ARM) be deployed together with the Revenue Cloud migration, rather than as separate projects?"],"overlaps":["SteelBrick CPQ","PSQuote"],"ent":"owned","entExpiry":null,"entProducts":["Revenue Cloud Advanced – Unlimited (CPQ Upgrade)","Revenue Events Starter Pack","Revenue Events (50,000)"],"clm":"onboard"},{"id":"psa-services-erp","vs":"A2R","domain":"PSA / Services ERP","name":"PSA / Services Financials","tools":["Certinia (FinancialForce)"],"users":"Professional Services / Finance"     const a=$('_a').value,d=$('_d').value,e=$('_e').value;
    return rowsData.filter(c=>(lockStream?true:st==='all'||c.vs===st))
      .filter(c=>a==='all'||c.alignment===a).filter(c=>d==='all'||c.domain===d)
      .filter(c=>{if(e==='all')return true;if(e==='licensed')return ['owned','owned-expiring','separate-agreement'].includes(c.ent);if(e==='overlap')return ['owned','owned-expiring'].includes(c.ent)&&c.overlaps.length;return true;})
      .filter(c=>{if(!q)return true;return [c.name,c.domain,...c.tools,...c.sf].join(' ').toLowerCase().includes(q);})
      .sort((x,y)=>x.domain!==y.domain?x.domain.localeCompare(y.domain):DATA.alignmentOrder.indexOf(x.alignment)-DATA.alignmentOrder.indexOf(y.alignment));
  }
  function draw(){
    const f=filtered();
    $('_body').innerHTML=f.length?f.map(capRowHtml).join(''):'<tr><td colspan="7" style="text-align:center;padding:34px" class="muted">No capabilities match these filters.</td></tr>';
    $('_count').textContent=f.length+' capabilit'+(f.length===1?'y':'ies')+' shown';
    if(opts.venn)drawVenn(id,f);
  }
  ['_s','_a','_d','_e','_q'].forEach(k=>{const el=$(k);if(el)el.addEventListener('input',draw);});
  draw();
}
function drawVenn(id,rows){
  const seen=new Map();
  rows.forEach(c=>{const cov=COVERED.has(c.alignment);const owned=c.ent==='owned'||c.ent==='owned-expiring';const os=new Set(c.overlaps);
    c.tools.forEach(t=>{const p=seen.get(t)||{cov:false,cand:false};p.cov=p.cov||cov;p.cand=p.cand||(owned&&os.has(t));seen.set(t,p);});});
  let covered=0,cand=0;seen.forEach(v=>{if(v.cov)covered++;if(v.cand)cand++;});
  const total=seen.size,aOnly=total-covered;
  const W=420,H=190,maxR=74,minR=14;
  const rFor=n=>total===0?minR:Math.max(minR,Math.min(maxR,maxR*Math.sqrt(n/total)));
  const rA=rFor(total),rB=covered===0?3:rFor(covered);
  const share=total===0?0:covered/total;const cxA=150,cy=H/2;
  const dist=(rA+rB)*(1-0.72*share);const cxB=cxA+Math.max(dist,Math.abs(rA-rB)+6);
  let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:420px">';
  if(total===0){svg+='<text x="'+(W/2)+'" y="'+(H/2)+'" text-anchor="middle" fill="var(--t4)" font-size="13">No tools match these filters.</text>';}
  else{
    svg+='<circle cx="'+cxA+'" cy="'+cy+'" r="'+rA+'" fill="rgba(148,163,184,.18)" stroke="rgba(100,116,139,.55)" stroke-width="1.5"/>';
    if(covered>0)svg+='<circle cx="'+cxB+'" cy="'+cy+'" r="'+rB+'" fill="rgba(16,185,129,.22)" stroke="rgba(16,185,129,.7)" stroke-width="1.5"/>';
    svg+='<text x="'+(cxA-rA*0.45)+'" y="'+(cy+5)+'" text-anchor="middle" fill="var(--t2)" font-size="18" font-weight="700">'+aOnly+'</text>';
    if(covered>0)svg+='<text x="'+(cxB+rB*0.35)+'" y="'+(cy+5)+'" text-anchor="middle" fill="#10b981" font-size="18" font-weight="700">'+covered+'</text>';
  }
  svg+='</svg>';
  const legend='<div style="min-width:0"><ul style="list-style:none;margin:0;padding:0;font-size:13px">'
    +'<li class="center gap8" style="margin:5px 0"><span class="dot" style="background:rgba(148,163,184,.6)"></span><span class="muted"><b style="color:var(--t2)">'+total+'</b> tools you run (in view)</span></li>'
    +'<li class="center gap8" style="margin:5px 0"><span class="dot" style="background:rgba(16,185,129,.6)"></span><span class="muted"><b style="color:var(--t2)">'+covered+'</b> Salesforce already covers</span></li>'
    +'<li class="muted" style="margin:5px 0 0 21px;font-size:12px">of which <b style="color:var(--t2)">'+cand+'</b> are owned consolidation candidates</li>'
    +'</ul><p class="faint" style="font-size:11px;margin-top:12px">'+total+' tool'+(total===1?'':'s')+' in view · '+covered+' overlap Salesforce · '+cand+' owned consolidation candidate'+(cand===1?'':'s')+'.</p></div>';
  document.getElementById(id+'_vennbody').innerHTML='<div class="venn-wrap">'+svg+legend+'</div>';
}
function toggleDetail(tr,capId){
  const existing=tr.nextElementSibling;
  if(existing&&existing.classList.contains('detail')){existing.remove();return;}
  // close any open detail in the same tbody
  tr.parentNode.querySelectorAll('tr.detail').forEach(d=>d.remove());
  const c=DATA.caps.find(x=>x.id===capId);
  tr.insertAdjacentHTML('afterend',detailHtml(c));
}
function openCap(capId){
  // jump to the map view and open that row's detail
  switchView('map');
  setTimeout(()=>{const tr=document.querySelector('#tbl_map_body tr[data-id="'+capId+'"]');if(tr){toggleDetail(tr,capId);tr.scrollIntoView({block:'center'});}},60);
}

/* ---------- LIFECYCLE ---------- */
function renderLifecycle(){
  const inScope=DATA.caps.filter(c=>LIFECYCLE_SCOPE.has(c.alignment));
  const nat=inScope.filter(c=>c.alignment==='native');
  const natOwned=nat.filter(c=>['owned','owned-expiring'].includes(c.ent)).length;
  const natNot=nat.filter(c=>c.ent==='not-licensed').length;
  const order={native:0,integrates:1,data360:2};
  const byStage={};DATA.stages.forEach(s=>byStage[s.key]=[]);const unplaced=[];
  inScope.forEach(c=>{if(c.clm&&byStage[c.clm])byStage[c.clm].push(c);else unplaced.push(c);});
  Object.keys(byStage).forEach(k=>byStage[k].sort((a,b)=>(order[a.alignment]-order[b.alignment])||a.name.localeCompare(b.name)));
  const card=c=>'<button class="capcard'+(c.alignment==='native'?' native':'')+'" onclick="openCap(\''+c.id+'\')"><div class="flex" style="justify-content:space-between;gap:8px"><span class="nm">'+esc(c.name)+'</span><span class="faint">▸</span></div><div class="flex wrap-f gap8 mt8">'+alignChip(c.alignment)+(c.ent==='na'?'':entChip(c.ent,c.entExpiry))+vsTag(c.vs)+'</div><div class="toolline">⬡ '+esc(c.tools.join(', '))+'</div></button>';
  const cols=DATA.stages.map((s,i)=>{const caps=byStage[s.key];return '<div class="card" style="display:flex;flex-direction:column"><div class="hd"><div class="center gap8"><div style="width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px">'+(i+1)+'</div><div><h2 style="font-size:14px">'+esc(s.label)+'</h2><div class="muted" style="font-size:11px">'+esc(s.blurb)+'</div></div></div></div><div class="bd" style="flex:1;display:flex;flex-direction:column;gap:10px">'+(caps.length?caps.map(card).join(''):'<span class="faint" style="font-size:11px;font-style:italic">No in-scope capabilities.</span>')+'</div></div>';}).join('');
  const unp=unplaced.length?'<div class="card mt16"><div class="hd"><h2 style="font-size:14px">Unplaced</h2><span class="faint" style="font-size:11px">'+unplaced.length+'</span></div><div class="bd stage-grid">'+unplaced.map(card).join('')+'</div></div>':'';
  return `
  <div class="sechd"><h1 class="secttitle">Customer lifecycle — where Salesforce already plays</h1>
  <p class="muted" style="max-width:820px;margin-top:6px">The capabilities where Salesforce genuinely covers a tool Blackbaud runs today, laid across the customer lifecycle: <b>Acquire → Onboard → Serve → Grow</b>. <b>Native</b> capabilities (Salesforce out-of-the-box) are drawn boldest; each card shows whether Blackbaud already <i>licenses</i> the Salesforce side and the tool it maps to.</p></div>
  <div class="legend mt16"><span class="center gap8"><span style="width:11px;height:11px;border-radius:3px;border:1px solid #10b98180;background:#10b9811f;display:inline-block"></span><b style="color:var(--t2)">Native</b> drawn boldest — SF out-of-box (${nat.length})</span><span class="center gap8"><span style="width:11px;height:11px;border-radius:3px;border:1px solid var(--border);background:var(--cardh);display:inline-block"></span>Integrates / Data 360 — SF plays, lighter</span><span>Of the ${nat.length} native: <b style="color:#10b981">${natOwned} already licensed</b>, <b style="color:var(--t2)">${natNot} not yet licensed</b> — all owned-or-ownable.</span></div>
  <div class="stage-grid">${cols}</div>${unp}`;
}

/* ---------- VALUE STREAM ---------- */
function renderStream(vs){
  const label=vs==='A2R'?'Awareness → Revenue':'Implement → Renew';
  const rows=DATA.caps.filter(c=>c.vs===vs);
  const n=rows.length;
  return '<div class="sechd"><h1 class="secttitle">'+label+'</h1><p class="muted" style="margin-top:6px">'+n+' capabilities in Blackbaud’s '+label+' value stream against their draft Salesforce alignment. Filter, then click a row to open the discussion.</p></div><div class="mt16" id="stream_'+vs+'"></div>';
}

/* ---------- NAV / BOOT ---------- */
function switchView(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===v));
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('active',s.id==='view-'+v));
  window.scrollTo(0,0);
}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)switchView(b.dataset.view);});
document.getElementById('theme').addEventListener('click',()=>{const h=document.documentElement;h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';});

// Render all views once (static content; filters re-draw their own tables)
document.getElementById('view-overview').innerHTML=renderOverview();
document.getElementById('view-map').innerHTML=renderTable('map',DATA.caps,{venn:true});
document.getElementById('view-lifecycle').innerHTML=renderLifecycle();
document.getElementById('view-a2r').innerHTML=renderStream('A2R');
document.getElementById('view-i2r').innerHTML=renderStream('I2R');
document.getElementById('view-a2r').querySelector('#stream_A2R').innerHTML=renderTable('a2r',DATA.caps.filter(c=>c.vs==='A2R'),{lockStream:'A2R'});
document.getElementById('view-i2r').querySelector('#stream_I2R').innerHTML=renderTable('i2r',DATA.caps.filter(c=>c.vs==='I2R'),{lockStream:'I2R'});
wireTable('map',DATA.caps,{venn:true});
wireTable('a2r',DATA.caps.filter(c=>c.vs==='A2R'),{lockStream:'A2R'});
wireTable('i2r',DATA.caps.filter(c=>c.vs==='I2R'),{lockStream:'I2R'});
document.getElementById('footer').innerHTML='Self-contained discussion canvas · entitlement data as of '+esc(DATA.entAsOf)+' — point-in-time, not a contract · alignment is a preliminary Salesforce view for discussion, not validated with Blackbaud.';
</script>
